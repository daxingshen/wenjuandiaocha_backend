# 星卷全栈一键启停:db + init(迁移/seed)+ backend + web(nginx 反代 + 前端两端)。
#   docker compose up -d      起全栈(首启自动建表 + seed)
#   docker compose stop       停(保留容器与数据卷)
#   docker compose down       删容器(数据卷 pgdata 保留,数据不丢)
#   docker compose down -v    连数据卷一起删(清库重来)
# 前端构建上下文是相邻的 UI 仓 ../wenjuandiaocha_ui,须两仓并列 checkout。
# 变量默认值见 .env.example;仅 db 对内、web 对外暴露端口。

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xingjuan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xingjuan_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-xingjuan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xingjuan}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 一次性:建表(goose up)后建 seed 账号。二者都幂等,重启安全。跑完退出(restart: no)。
  init:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "goose -dir /app/db/migrations up && /app/seed"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL_INTERNAL:-postgres://xingjuan:xingjuan_dev_pwd@db:5432/xingjuan?sslmode=disable}
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://xingjuan:xingjuan_dev_pwd@db:5432/xingjuan?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/server"]
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://xingjuan:xingjuan_dev_pwd@db:5432/xingjuan?sslmode=disable}
      HTTP_ADDR: ":8080"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # 不映射宿主端口:只经 web 反代,保证 /api 与前端同源。
    expose:
      - "8080"

  web:
    build:
      context: ../wenjuandiaocha_ui
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      # 路由配置归后端仓,bind-mount 进 nginx(改路由不必重建前端镜像)。
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
