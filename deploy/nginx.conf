# 星卷单入口反代(方案B:studio 占根 /,runtime 挂 /f,/api 反代到后端)。
# 同源:前端页面与 /api 同一 origin,故 cookie(credentials:include)天然带上、免 CORS。
# 静态 dist 由前端构建镜像产出、挂进本容器(见 docker-compose.yml web 服务)。

server {
    listen 80;
    server_name _;

    # gzip 静态资源(可选,减小首屏体积)。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- /api → 后端 ----
    # 前缀匹配;透传 Host 与真实客户端 IP(后端限频按 IP,见 README「public」段)。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- /f → runtime(作答端)----
    # runtime 用 vite build --base=/f/,资产引用 /f/assets/*;hash 路由,SPA fallback 到 /f/index.html。
    location /f/ {
        alias /usr/share/nginx/html/runtime/;
        try_files $uri $uri/ /f/index.html;
    }
    # 裸 /f(无尾斜杠)重定向到 /f/,否则 alias 不命中。
    location = /f {
        return 301 /f/;
    }

    # ---- / → studio(管理端)----
    # studio 默认 base=/,pushState 路由(/login /home /survey/:id/:tab),SPA fallback 到 /index.html。
    location / {
        root /usr/share/nginx/html/studio;
        try_files $uri $uri/ /index.html;
    }
}
